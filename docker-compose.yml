services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betting-api
    environment:
      ARTIFACT_SIGNING_KEY: ${ARTIFACT_SIGNING_KEY:-}
      CLI_AUTH_TOKENS: ${CLI_AUTH_TOKENS:-}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      MODELS_DIR: /app/data/models
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,sys,urllib.request;resp=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/model-health', timeout=5);payload=json.load(resp);models=payload.get('models',[]);ready=resp.getcode()==200 and payload.get('status')=='ok' and payload.get('model_count',0)>0 and all(model.get('status')!='missing_file' for model in models);sys.exit(0 if ready else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: betting-scheduler
    depends_on:
      api:
        condition: service_healthy
    environment:
      ARTIFACT_SIGNING_KEY: ${ARTIFACT_SIGNING_KEY:-}
      MODELS_DIR: /app/data/models
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./data:/app/data
