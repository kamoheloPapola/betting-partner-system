services:
  db:
    image: alpine:3.21
    container_name: betting-db
    command: ["sh", "-c", "mkdir -p /data/models && tail -f /dev/null"]
    volumes:
      - model_db:/data/models

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betting-api
    depends_on:
      - db
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8000:8000"
    volumes:
      - model_db:/app/data/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request;resp=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/model-health', timeout=5);sys.exit(0 if resp.getcode()==200 else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: betting-scheduler
    depends_on:
      - db
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - model_db:/app/data/models

volumes:
  model_db:
