services:
  - name: football-intelligence-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/model-health
    envVars:
      - key: RAPIDAPI_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        sync: false

  - name: football-intelligence-scheduler
    type: cron
    runtime: docker
    dockerfilePath: ./Dockerfile.scheduler
    schedule: "0 6 * * *"
    envVars:
      - key: RAPIDAPI_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        sync: false
