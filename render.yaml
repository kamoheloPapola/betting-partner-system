services:
  - name: football-intelligence-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: RAPIDAPI_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: SKIP_MODEL_LOCK_CHECK
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MODELS_DIR
        value: "/app/models"
      - key: RENDER
        value: "true"
