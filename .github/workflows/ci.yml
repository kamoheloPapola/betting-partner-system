name: CI

on:
  push:
    branches:
      - codex/canonical-cleanup
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.2'
          architecture: x64

      - name: Install and verify locked wheels
        run: |
          python -m pip --isolated install --only-binary=:all: --no-deps -r requirements-canonical-windows-py314.lock
          python -m pip --isolated check

      # Debt: The mapping publication module uses four private, hash-pinned inputs.
      # Run it in private verification until approved tracked fixtures can cover these checks.
      - name: Run Git-only Canonical tests
        run: python -B -m pytest -q -ra --confcutdir=tests/canonical --ignore=tests/canonical/test_provider_team_mapping.py tests/canonical

  legacy:
    name: Legacy (informational)
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.2'

      - name: Install legacy test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run legacy tests
        run: python -B -m pytest -q -ra --continue-on-collection-errors --ignore=tests/canonical -m 'not integration' tests
