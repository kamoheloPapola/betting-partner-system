name: Daily Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q

      - name: Run daily pipeline (PL)
        run: python -m src.cli run-daily-pipeline --league PL

      - name: Run daily pipeline (BL1)
        run: python -m src.cli run-daily-pipeline --league BL1

      - name: Run daily pipeline (FL1)
        run: python -m src.cli run-daily-pipeline --league FL1

      - name: Run daily pipeline (SA)
        run: python -m src.cli run-daily-pipeline --league SA

      - name: Run daily pipeline (PD)
        run: python -m src.cli run-daily-pipeline --league PD
